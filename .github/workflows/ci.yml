name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # h9x and h9x-runner, and the unit tests, on Linux and macOS.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build
      - run: zig build test

  # The proposal rules (design/README.md), on every PR.
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tips of every branch, so `check` can find each proposal's.
      - run: git fetch -q --no-tags --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build design -- check
